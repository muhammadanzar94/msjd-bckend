# /etc/nginx/sites-available/msjid
#
# Replace __USER__ with your VM username before installing. `server_name _;`
# is a catch-all — matches direct IP access, a nip.io testing hostname, and
# a real domain later, so this file never needs editing again once your
# BASE_DOMAIN changes (that's an env var, not an nginx setting). Routes
# /admin/, /api/, /media/, /static/ to Django (gunicorn on :8000); everything
# else to Next.js (:3000). Next.js's own proxy.ts resolves the masjid tenant
# from the Host header, so nginx just needs to forward Host untouched.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# If you're behind Cloudflare (proxied/orange-cloud DNS), nginx otherwise
# sees Cloudflare's own edge IP as $remote_addr for every request, not the
# real visitor — which breaks IP-based rate limiting on the public
# endpoints (everyone would share Cloudflare's small pool of IPs). This
# tells nginx to trust Cloudflare's published ranges and pull the real
# visitor IP from the CF-Connecting-IP header instead. Harmless if you're
# not using Cloudflare — these directives just never match.
# Current ranges: https://www.cloudflare.com/ips/ (check occasionally —
# they change rarely, but do change).
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 35M;  # matches the 30MB intro-video cap + headroom

    location /media/ {
        alias /home/__USER__/masjid/media/;
    }

    location /static/ {
        alias /home/__USER__/masjid/staticfiles/;
    }

    location ~ ^/(admin|api)/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
